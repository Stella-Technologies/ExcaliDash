apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "excalidash.fullname" . }}-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  DATABASE_PROVIDER: {{ include "excalidash.databaseProvider" . }}
  DATABASE_URL: {{ include "excalidash.databaseUrl" . | quote }}
  NODE_ENV: {{ .Values.backend.env.NODE_ENV | quote }}
  PORT: {{ .Values.backend.env.PORT | quote }}
  AUTH_MODE: {{ .Values.backend.config.authMode | quote }}
  FRONTEND_URL: {{ .Values.backend.config.frontendUrl | quote }}
  TRUST_PROXY: {{ .Values.backend.config.trustProxy | quote }}
  ENABLE_PASSWORD_RESET: {{ .Values.backend.config.enablePasswordReset | quote }}
  ENABLE_REFRESH_TOKEN_ROTATION: {{ .Values.backend.config.enableRefreshTokenRotation | quote }}
  ENABLE_AUDIT_LOGGING: {{ .Values.backend.config.enableAuditLogging | quote }}
  ENFORCE_HTTPS_REDIRECT: {{ .Values.backend.config.enforceHttpsRedirect | quote }}
  RATE_LIMIT_MAX_REQUESTS: {{ .Values.backend.config.rateLimitMaxRequests | quote }}
  CSRF_MAX_REQUESTS: {{ .Values.backend.config.csrfMaxRequests | quote }}
  JWT_ACCESS_EXPIRES_IN: {{ .Values.backend.config.jwtAccessExpiresIn | quote }}
  JWT_REFRESH_EXPIRES_IN: {{ .Values.backend.config.jwtRefreshExpiresIn | quote }}
  BOOTSTRAP_SETUP_CODE_TTL_MS: {{ .Values.backend.config.bootstrapSetupCodeTtlMs | quote }}
  BOOTSTRAP_SETUP_CODE_MAX_ATTEMPTS: {{ .Values.backend.config.bootstrapSetupCodeMaxAttempts | quote }}
  DRAWINGS_CACHE_TTL_MS: {{ .Values.backend.config.drawingsCacheTtlMs | quote }}
