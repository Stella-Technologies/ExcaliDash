{{- if .Values.backend.secretProvider.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "excalidash.backend.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""  # Set workload identity client ID
    keyvaultName: {{ .Values.backend.secretProvider.keyVaultName | quote }}
    tenantId: {{ .Values.backend.secretProvider.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.backend.secretProvider.secrets }}
        - |
          objectName: {{ .vaultSecret }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ include "excalidash.backend.fullname" . }}-secrets
      type: Opaque
      data:
        {{- range .Values.backend.secretProvider.secrets }}
        - key: {{ .envVar }}
          objectName: {{ .vaultSecret }}
        {{- end }}
{{- end }}
